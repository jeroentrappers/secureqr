services:
  secureqr:
    build: .
    image: secureqr-server
    init: true
    restart: unless-stopped
    # Bind to loopback; put the host's nginx (TLS) in front of it.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TRUST_PROXY: "1"
      RATE_LIMIT_PER_MIN: "20"
      MAX_CONCURRENCY: "3"
      CACHE_DIR: /var/cache/secureqr
    # Chromium runs as a non-root user inside its own sandbox, which needs
    # user namespaces. The seccomp profile is Docker's default plus those calls.
    # Docker's default AppArmor profile forbids them, so it is switched off here;
    # deploy/apparmor-secureqr is a tighter replacement (see README).
    # No cap_drop: dropping the bounding set breaks the browser sandbox, and a
    # non-root process with no-new-privileges holds no capabilities anyway.
    security_opt:
      - seccomp=./seccomp_profile.json
      - apparmor=unconfined
      - no-new-privileges:true
    read_only: true
    # Kept answers (encrypted, see README "Result reuse"); the only writable disk.
    volumes:
      - cache:/var/cache/secureqr
    tmpfs:
      - /tmp:exec,size=512m
      - /home/pwuser:exec,size=256m,uid=1001,gid=1001
    shm_size: 1gb
    mem_limit: 2g
    pids_limit: 512

volumes:
  cache:
